[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reylog"
version = "0.1.0"
description = "A small, opinionated logging wrapper around Loguru for scripts and research code."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Reinaldo Mock" }
]
keywords = ["logging", "loguru", "research", "cli", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Logging",
]
dependencies = [
  "loguru>=0.7,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.urls]
Homepage = "https://github.com/Reinald0-M/reylog"
Repository = "https://github.com/Reinald0-M/reylog"
Issues = "https://github.com/Reinald0-M/reylog/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reylog"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
